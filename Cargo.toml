[package]
name = "rfc-agent-cli"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.98"
description = "Agent-friendly CLI and MCP server for IETF RFCs"
license = "MIT"
repository = "https://github.com/gkk-dev-ops/rfc-cli"
homepage = "https://github.com/gkk-dev-ops/rfc-cli"
keywords = ["rfc", "ietf", "cli", "mcp", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "rfc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset"] }
rmcp = { version = "3.5", features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "fs", "io-std"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
